<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bom Dia Harumi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,600&family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --peach:#FFB37B;
    --rose:#FF6B9D;
    --gold:#FFD37E;
    --cream:#F5F0EB;
    --muted:#9c8f86;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    overflow-x:hidden;
  }

  .screen{
    min-height:100vh;
    width:100%;
    display:none;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:32px 20px;
  }

  .screen.active{ display:flex; }

  /* ---------- SUNRISE GLOW (signature element) ---------- */
  .sunrise{
    position:absolute;
    bottom:-40%;
    left:50%;
    transform:translateX(-50%);
    width:120vw;
    max-width:900px;
    aspect-ratio:1/1;
    border-radius:50%;
    background:radial-gradient(circle at center,
      rgba(255,211,126,0.55) 0%,
      rgba(255,107,157,0.28) 35%,
      rgba(255,107,157,0.08) 60%,
      rgba(0,0,0,0) 72%);
    filter:blur(2px);
    animation:rise 3.5s cubic-bezier(.2,.8,.2,1) forwards;
    pointer-events:none;
    z-index:0;
  }

  @keyframes rise{
    0%{ bottom:-60%; opacity:0; }
    100%{ bottom:-32%; opacity:1; }
  }

  /* ---------- SCREEN 1 : TITLE ---------- */
  #screen-inicio .conteudo{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:600px;
  }

  .eyebrow{
    font-size:0.75rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:18px;
  }

  h1.titulo{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-size:clamp(2.4rem, 8vw, 4.4rem);
    line-height:1.05;
    letter-spacing:0.01em;
  }

  h1.titulo .harumi{
    display:block;
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(3rem, 11vw, 6rem);
    background:linear-gradient(90deg, var(--gold), var(--rose));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-top:6px;
  }

  .subtitulo{
    margin-top:22px;
    font-size:1rem;
    color:var(--muted);
    font-weight:300;
    letter-spacing:0.02em;
  }

  .btn{
    appearance:none;
    border:1.5px solid var(--rose);
    background:transparent;
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    font-size:1rem;
    font-weight:500;
    letter-spacing:0.04em;
    padding:16px 40px;
    border-radius:999px;
    cursor:pointer;
    transition:transform .25s ease, background .3s ease, box-shadow .3s ease, color .3s ease;
    margin-top:40px;
    width:min(100%, 300px);
  }

  .btn:hover, .btn:focus-visible{
    background:linear-gradient(90deg, var(--rose), var(--gold));
    color:#1a0e08;
    box-shadow:0 0 34px rgba(255,107,157,0.45);
    transform:translateY(-2px);
    outline:none;
  }

  .btn:active{ transform:translateY(0px) scale(.98); }

  .btn-outline{
    background:transparent;
    border:1.5px solid rgba(245,240,235,0.25);
    color:var(--cream);
  }
  .btn-outline:hover, .btn-outline:focus-visible{
    background:rgba(245,240,235,0.08);
    color:var(--cream);
    box-shadow:none;
    border-color:rgba(245,240,235,0.5);
  }

  /* ---------- SCREEN 2 : PERGUNTAS ---------- */
  #screen-quiz .quiz-box{
    width:100%;
    max-width:560px;
    z-index:1;
  }

  .progresso{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:34px;
  }

  .barra{
    flex:1;
    height:3px;
    background:rgba(245,240,235,0.14);
    border-radius:3px;
    overflow:hidden;
  }

  .barra-preenchida{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--gold), var(--rose));
    transition:width .5s ease;
  }

  .contador{
    font-size:0.8rem;
    color:var(--muted);
    white-space:nowrap;
    font-variant-numeric:tabular-nums;
  }

  .pergunta-eyebrow{
    font-size:0.72rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--rose);
    margin-bottom:14px;
  }

  .pergunta-texto{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(1.4rem, 4.2vw, 2rem);
    line-height:1.35;
    margin-bottom:32px;
  }

  .opcoes{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .opcao{
    text-align:left;
    background:rgba(245,240,235,0.03);
    border:1px solid rgba(245,240,235,0.14);
    color:var(--cream);
    font-family:'Poppins', sans-serif;
    font-size:0.98rem;
    font-weight:400;
    padding:16px 20px;
    border-radius:14px;
    cursor:pointer;
    transition:border-color .25s ease, background .25s ease, transform .15s ease;
  }

  .opcao:hover, .opcao:focus-visible{
    border-color:var(--rose);
    background:rgba(255,107,157,0.08);
    transform:translateX(4px);
    outline:none;
  }

  .opcao.selecionada{
    border-color:var(--gold);
    background:linear-gradient(90deg, rgba(255,211,126,0.14), rgba(255,107,157,0.1));
  }

  /* ---------- SCREEN 3 : FINAL ---------- */
  #screen-final .conteudo{
    text-align:center;
    z-index:1;
    max-width:100%;
    padding:0 4vw;
  }

  .final-eyebrow{
    font-size:0.78rem;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:20px;
    opacity:0;
    animation:fadein .8s ease forwards;
  }

  .te-amo{
    font-family:'Dancing Script', cursive;
    font-weight:700;
    font-size:clamp(3rem, 15vw, 10rem);
    line-height:1;
    background:linear-gradient(90deg, var(--gold), var(--rose) 55%, var(--gold));
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    opacity:0;
    animation:fadein 1.2s ease .3s forwards, brilho 4s linear infinite;
    word-break:break-word;
  }

  @keyframes fadein{
    to{ opacity:1; }
  }

  @keyframes brilho{
    to{ background-position:200% center; }
  }

  .coracoes{
    margin-top:28px;
    font-size:clamp(1.4rem, 4vw, 2.2rem);
    opacity:0;
    animation:fadein 1s ease 1s forwards;
    letter-spacing:0.3em;
  }

  .voltar-link{
    display:inline-block;
    margin-top:44px;
    font-size:0.85rem;
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    opacity:0;
    animation:fadein 1s ease 1.4s forwards;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Poppins', sans-serif;
  }
  .voltar-link:hover{ color:var(--cream); border-bottom-color:var(--muted); }

  @media (prefers-reduced-motion: reduce){
    .sunrise, .te-amo, .final-eyebrow, .coracoes, .voltar-link{
      animation:none !important;
      opacity:1 !important;
    }
  }

  @media (max-width:480px){
    .btn{ padding:15px 28px; font-size:0.95rem; }
    .opcao{ padding:14px 16px; }
  }
</style>
</head>
<body>

  <!-- TELA 1 : ABERTURA -->
  <section class="screen active" id="screen-inicio">
    <div class="sunrise"></div>
    <div class="conteudo">
      <p class="eyebrow">Para você</p>
      <h1 class="titulo">Bom dia<span class="harumi">Harumi</span></h1>
      <p class="subtitulo">Preparei 10 perguntinhas antes da gente começar o dia. Topa responder?</p>
      <button class="btn" id="btn-comecar" type="button">Começar</button>
    </div>
  </section>

  <!-- TELA 2 : PERGUNTAS -->
  <section class="screen" id="screen-quiz">
    <div class="quiz-box">
      <div class="progresso">
        <div class="barra"><div class="barra-preenchida" id="barra"></div></div>
        <span class="contador" id="contador">1 / 10</span>
      </div>
      <p class="pergunta-eyebrow">Pergunta</p>
      <p class="pergunta-texto" id="pergunta-texto"></p>
      <div class="opcoes" id="opcoes"></div>
    </div>
  </section>

  <!-- TELA 3 : FINAL -->
  <section class="screen" id="screen-final">
    <div class="conteudo">
      <p class="final-eyebrow">Depois de tudo isso, só resta dizer</p>
      <h2 class="te-amo">Te amo Harmumy</h2>
      <h3>Não sou viadinho</h3>
      <p class="coracoes">✦ ✧ ✦ ✧ ✦</p>
      <button class="voltar-link" id="btn-recomecar" type="button">responder de novo</button>
    </div>
  </section>

<script>
  const perguntas = [
    {
      texto: "Qual é a nossa comida favorita quando estamos juntos?",
      opcoes: ["Aquele lanche de sempre", "Doce, sem dúvida", "Comida japonesa", "Qualquer uma, contanto que seja com você"]
    },
    {
      texto: "Qual seria o cenário perfeito para um dia inteiro juntos?",
      opcoes: ["Um dia de praia", "Maratona de filmes em casa", "Passeio pela cidade sem destino", "Simplesmente conversando até tarde"]
    },
    {
      texto: "Se a nossa amizade tivesse uma música tema, qual seria o estilo?",
      opcoes: ["Aquele BTS animado", "Uma balada ", "Piseiro adoidado", "Aquela que a gente sempre canta junto"]
    },
    {
      texto: "O que mais te faz rir quando estamos juntos?",
      opcoes: ["Nossas piadas internas", "Meu jeito bobo", "As situações aleatórias que vivemos", "Tudo, com você tudo é engraçado"]
    },
    {
      texto: "Qual é o nosso lugar favorito?",
      opcoes: ["Aquele café que a gente ama", "Minha casa (ou a sua)", "Algum lugar ao ar livre", "Onde quer que a gente esteja juntos"]
    },
    {
      texto: "Se pudéssemos viajar para qualquer lugar do mundo agora, para onde iríamos?",
      opcoes: ["Japão", "Alguma praia paradisíaca", "Uma cidade cheia de luzes", "Não importa o lugar, desde que seja com você"]
    },
    {
      texto: "Qual é a lembrança mais engraçada que já vivemos?",
      opcoes: ["Aquela vez inesquecível", "Não dá nem pra escolher uma só", "As nossas conversas malucas", "Cada pequeno momento bobo do dia a dia"]
    },
    {
      texto: "Em uma palavra, como você descreveria o que sente por mim?",
      opcoes: ["Desgosto", "Admiração", "Carinho", "Amor"]
    },
    {
      texto: "O que você mais admira em mim?",
      opcoes: ["Meu jeito de ser", "Minha lealdade", "Meu sorriso", "Tudo, sem exceção"]
    },
    {
      texto: "Complete: \"Bom dia, Souza, você é...\"",
      opcoes: ["...a melhor parte do meu dia", "...alguém muito especial pra mim", "...minha pessoa favorita", "...a razão do meu sorriso"]
    }
  ];

  let atual = 0;

  const telaInicio = document.getElementById('screen-inicio');
  const telaQuiz   = document.getElementById('screen-quiz');
  const telaFinal  = document.getElementById('screen-final');

  const perguntaTexto = document.getElementById('pergunta-texto');
  const opcoesContainer = document.getElementById('opcoes');
  const barra = document.getElementById('barra');
  const contador = document.getElementById('contador');

  function mostrarTela(tela){
    [telaInicio, telaQuiz, telaFinal].forEach(t => t.classList.remove('active'));
    tela.classList.add('active');
  }

  function renderizarPergunta(){
    const p = perguntas[atual];
    perguntaTexto.textContent = p.texto;
    opcoesContainer.innerHTML = '';

    p.opcoes.forEach(opcao => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opcao';
      btn.textContent = opcao;
      btn.addEventListener('click', () => selecionarOpcao(btn));
      opcoesContainer.appendChild(btn);
    });

    barra.style.width = ((atual) / perguntas.length * 100) + '%';
    contador.textContent = (atual + 1) + ' / ' + perguntas.length;
  }

  function selecionarOpcao(botao){
    document.querySelectorAll('.opcao').forEach(b => b.classList.remove('selecionada'));
    botao.classList.add('selecionada');

    setTimeout(() => {
      atual++;
      if (atual < perguntas.length) {
        renderizarPergunta();
      } else {
        barra.style.width = '100%';
        setTimeout(() => mostrarTela(telaFinal), 300);
      }
    }, 350);
  }

  document.getElementById('btn-comecar').addEventListener('click', () => {
    atual = 0;
    mostrarTela(telaQuiz);
    renderizarPergunta();
  });

  document.getElementById('btn-recomecar').addEventListener('click', () => {
    atual = 0;
    mostrarTela(telaInicio);
  });
</script>

</body>
</html>
